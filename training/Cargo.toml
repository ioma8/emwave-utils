[package]
name = "emwave-trainer"
version = "0.1.0"
edition = "2021"
[features]
default = ["desktop"]
desktop = []

[[bin]]
name = "emwave-trainer"
path = "src/main.rs"
required-features = ["desktop"]
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["android-native-activity", "default_fonts", "glow"] }
parking_lot = "0.12"

[target.'cfg(not(target_os = "android"))'.dependencies]
hidapi = "2.6"
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
nusb = "0.2"
winit = "0.30"

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[package.metadata.android]
package = "com.emwave.resonance"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
apk_name = "emwave-resonance"

[package.metadata.android.application]
label = "Resonance"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
extract_native_libs = true

[package.metadata.android.application.activity]
label = "Resonance"
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout"
exported = true
[[package.metadata.android.uses_feature]]
name = "android.hardware.usb.host"
required = true

[profile.release]
opt-level = 2
